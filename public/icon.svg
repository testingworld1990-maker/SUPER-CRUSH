<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0C2E22" />
      <stop offset="58%" stop-color="#07131B" />
      <stop offset="100%" stop-color="#04070D" />
    </radialGradient>
    <linearGradient id="steel" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="48%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#emerald)" stroke-width="10" stroke-opacity="0.35" />
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#steel)" stroke-width="24" />
  <circle cx="256" cy="256" r="168" fill="none" stroke="#34D399" stroke-width="3" stroke-opacity="0.7" />
  <!-- Doomsday Emerald Energy Arcs -->
  <path d="M132 340 L185 268 L160 258 L256 122 L240 218 L286 226 L210 368" fill="none" stroke="#34D399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.9" />
  <!-- Brushed Steel Avengers-Style A Crest -->
  <path d="M268 78 L314 78 L314 390 L264 390 L264 326 L186 326 L154 390 L102 390 Z M264 174 L210 280 L264 280 Z" fill="url(#steel)" stroke="#E2E8F0" stroke-width="4" stroke-linejoin="round" />
  <!-- Arrowhead Crossbar Accent -->
